services:
  foodscope:
    build: .
    container_name: foodscope
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "src.main", "--daemon"]
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-m", "src.main", "--healthcheck"]
      interval: 5m
      timeout: 30s
      retries: 3
